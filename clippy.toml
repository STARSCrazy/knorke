    { path = "f64::min", reason = "result for -0.0 vs +0.0 differs between platforms and build profiles; compare explicitly (ADR 0011)" },
    { path = "std::time::Instant::elapsed", reason = "modules take time as Tick (ADR 0003); only host-side tools read clocks" },
