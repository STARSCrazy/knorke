# Hash maps are forbidden as types, not only their constructors: `HashMap::default()`,
# `.collect::<HashMap<_, _>>()` and `HashMap::from` with the default `RandomState` cannot be
# caught method by method, and even with a fixed hasher the iteration order differs between
# platforms and Rust versions (ADR 0003, ADR 0011). Simulation code uses `HandleMap` for
# per-entity data and `BTreeMap`/`BTreeSet` or sorted `Vec`s for everything else. Host tools
# and presentation crates may allow the lint locally with a reason.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is not deterministic across platforms; use HandleMap, BTreeMap or a sorted Vec (ADR 0003)" },
    { path = "std::collections::HashSet", reason = "iteration order is not deterministic across platforms; use BitSet, BTreeSet or a sorted Vec (ADR 0003)" },
    { path = "std::collections::hash_map::RandomState", reason = "randomly seeded; use knorke_types::StableState (ADR 0003)" },
]
