[workspace]
resolver = "3"
members = [
    "crates/knorke-types",
    "crates/knorke-math",
    "crates/knorke-observe",
    "crates/knorke-exec",
    "crates/knorke-replay",
    "crates/knorke-runtime",
    "crates/knorke-scene",
    "crates/knorke-agent",
    "crates/knorke-grid",
    "crates/knorke-navigation",
    "crates/knorke-perception",
    "crates/knorke-ai",
    "crates/knorke-render",
    "crates/knorke-lighting",
    "crates/knorke-gpu",
    "crates/knorke-light2d",
    "crates/knorke-integration",
    "crates/knorke-post",
    "crates/knorke-audio",
    "crates/knorke-audio-sdl",
    "crates/knorke-input",
    "crates/knorke-host",
    "tests/contracts",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.100"
publish = false

[workspace.dependencies]
knorke-types = { path = "crates/knorke-types", version = "0.0.1" }
knorke-math = { path = "crates/knorke-math", version = "0.0.1" }
knorke-observe = { path = "crates/knorke-observe", version = "0.0.1", default-features = false }
bytemuck = { version = "1.20", default-features = false }
mint = { version = "0.5", default-features = false }
libm = "0.2.16"
knorke-exec = { path = "crates/knorke-exec", version = "0.0.1" }
knorke-replay = { path = "crates/knorke-replay", version = "0.0.1" }
knorke-runtime = { path = "crates/knorke-runtime", version = "0.0.1" }
knorke-scene = { path = "crates/knorke-scene", version = "0.0.1" }
# Text formats and schemas: authoring and agent plane only, never a domain module (ADR 0018).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
rayon = "1.10"
knorke-grid = { path = "crates/knorke-grid", version = "0.0.1" }
knorke-navigation = { path = "crates/knorke-navigation", version = "0.0.1" }
knorke-perception = { path = "crates/knorke-perception", version = "0.0.1" }
knorke-ai = { path = "crates/knorke-ai", version = "0.0.1" }
knorke-render = { path = "crates/knorke-render", version = "0.0.1" }
knorke-lighting = { path = "crates/knorke-lighting", version = "0.0.1" }
knorke-gpu = { path = "crates/knorke-gpu", version = "0.0.1" }
sdl3-sys = { version = "0.7.3", default-features = false, features = ["debug-impls"] }
knorke-light2d = { path = "crates/knorke-light2d", version = "0.0.1" }
knorke-integration = { path = "crates/knorke-integration", version = "0.0.1" }
knorke-post = { path = "crates/knorke-post", version = "0.0.1" }
knorke-audio = { path = "crates/knorke-audio", version = "0.0.1" }
knorke-input = { path = "crates/knorke-input", version = "0.0.1" }
knorke-audio-sdl = { path = "crates/knorke-audio-sdl", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Smaller PDBs and faster dev/test linking while keeping file + line in stack traces.
[profile.dev]
debug = "line-tables-only"

# The bundled SDL3 (knorke-gpu, feature `sdl-build-static`) is built by CMake with a build
# type derived from this opt-level. Debug (opt-level 0) links the debug C runtime, which
# clashes with the release runtime Rust links on MSVC (LNK4098); opt-level 1 gives
# RelWithDebInfo.
[profile.dev.package.sdl3-sys]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
