[workspace]
resolver = "3"
members = [
    "crates/knorke-types",
    "crates/knorke-math",
    "crates/knorke-observe",
    "crates/knorke-exec",
    "crates/knorke-replay",
    "crates/knorke-render",
    "crates/knorke-lighting",
    "crates/knorke-integration",
    "tests/contracts",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
publish = false

[workspace.dependencies]
knorke-types = { path = "crates/knorke-types", version = "0.0.1" }
knorke-math = { path = "crates/knorke-math", version = "0.0.1" }
knorke-observe = { path = "crates/knorke-observe", version = "0.0.1", default-features = false }
bytemuck = { version = "1.20", default-features = false }
mint = { version = "0.5", default-features = false }
libm = "0.2.16"
knorke-exec = { path = "crates/knorke-exec", version = "0.0.1" }
knorke-replay = { path = "crates/knorke-replay", version = "0.0.1" }
rayon = "1.10"
knorke-render = { path = "crates/knorke-render", version = "0.0.1" }
knorke-lighting = { path = "crates/knorke-lighting", version = "0.0.1" }
knorke-integration = { path = "crates/knorke-integration", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
