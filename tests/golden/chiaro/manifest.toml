# Golden scenes of the Chiaro port (package P3). Generated by running the C++ demos in screenshot mode.
# Reference renderer: Chiaro (C++), revision 9bc5b9b30cff57c784a3d675ed932700dec28a22 (2026-11-16), Release, MSVC 14.29,
# SDL 3.4.20, built out-of-tree. GPU: AMD Radeon RX 6700 XT, driver 32.0.21045.16010 (the only GPU in the machine).
# Captured 2026-11-23, 6 runs per scene and backend (direct3d12 and vulkan) with
#   <demo>.exe --driver <backend> <args> [--time <time>] --screenshot <file.bmp>
# The demos save 1280x720 RGBA8 (R8G8B8A8_UNORM, the demos' internal resolution is 640x360 pixel-art scaled to the
# window); the PNG is RGB (alpha is always 255). Image = vulkan run 0.
# Noise = worst case over all pairs of the 6 runs of one backend (cross_backend: every vulkan run against every
# direct3d12 run), measured outside ignore_rects. Per-channel maximum absolute difference (0..255) per pixel;
# *_pct = share of all pixels whose per-pixel maximum channel difference is > 0 / > 2 / > 8 / > 32.
# deterministic = false: the scene depends on wall-clock time or a scripted mouse (not frozen by --time).

[meta]
chiaro_revision = "9bc5b9b30cff57c784a3d675ed932700dec28a22"
build = "Release, MSVC 14.29.30133, SDL 3.4.20, cmake preset msvc, out-of-tree"
gpu = "AMD Radeon RX 6700 XT"
driver = "32.0.21045.16010"
captured = "2026-11-23"
runs_per_backend = 6

# Proposed parity budgets, mirrored in knorke_contract_tests::parity (ParityBudget::STRICT / LOOSE).
# Measured: deterministic scenes are bit-identical run to run on one backend (outside the HUD);
# D3D12 against Vulkan differs in at most 0.098 % of pixels, at most 0.0009 % above 2 (max 86).
[thresholds.strict]  # deterministic = true
tolerance = 2
max_outlier_ppm = 100
hard_limit = 128

[thresholds.loose]  # deterministic = false
tolerance = 32
max_outlier_ppm = 10000
hard_limit = 255

[[scene]]
name = "minimal_normal_map"
file = "minimal_normal_map.png"
demo = "minimal_normal_map"
args = ["--smoke"]
resolution = [64, 64]
deterministic = true
note = "one point light on a normal-mapped dome, 64x64, no HUD"
golden_from = "vulkan run 0"
noise_vulkan = { max = 0, differing_pct = 0.0000, over2_pct = 0.0000, over8_pct = 0.0000, over32_pct = 0.0000 }
noise_direct3d12 = { max = 0, differing_pct = 0.0000, over2_pct = 0.0000, over8_pct = 0.0000, over32_pct = 0.0000 }
cross_backend = { max = 0, differing_pct = 0.0000, over2_pct = 0.0000, over8_pct = 0.0000, over32_pct = 0.0000 }

