[package]
name = "knorke-contract-tests"
description = "Cross-crate contract tests: zero-copy exchange, no allocations in hot paths, layout guarantees. Not shipped."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
knorke-types = { workspace = true }
knorke-math = { workspace = true }
knorke-replay = { workspace = true }
# Golden PNGs of the parity tests (`parity::load_png_rgba8`).
png = "0.17"
# Only for the GPU contract of the pass plan (feature `gpu`).
knorke-gpu = { workspace = true, optional = true }

[features]
# GPU contracts (no_alloc_pass_plan): need a Vulkan device and the shader pack.
gpu = ["dep:knorke-gpu", "knorke-gpu/sdl", "knorke-light2d/gpu"]
# `gpu` with SDL3 built from source and linked statically (needs CMake), as in knorke-gpu.
sdl-build-static = ["gpu", "knorke-gpu/sdl-build-static"]

[dev-dependencies]
knorke-observe = { workspace = true, features = ["std"] }
knorke-exec = { workspace = true }
knorke-render = { workspace = true }
knorke-integration = { workspace = true }
knorke-light2d = { workspace = true }
knorke-post = { workspace = true }

# Own lint table: the allocation counter needs `unsafe impl GlobalAlloc`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bench]]
name = "foundations"
harness = false
