[package]
name = "knorke-contract-tests"
description = "Cross-crate contract tests: zero-copy exchange, no allocations in hot paths, layout guarantees. Not shipped."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
knorke-types = { workspace = true }
knorke-math = { workspace = true }
knorke-replay = { workspace = true }

[dev-dependencies]
knorke-observe = { workspace = true, features = ["std"] }
knorke-exec = { workspace = true }
knorke-render = { workspace = true }
knorke-integration = { workspace = true }
knorke-light2d = { workspace = true }
knorke-post = { workspace = true }

# Own lint table: the allocation counter needs `unsafe impl GlobalAlloc`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bench]]
name = "foundations"
harness = false
