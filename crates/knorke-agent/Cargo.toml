[package]
name = "knorke-agent"
description = "The agent plane of the Knorke Engine: discover, inspect, validate, mutate and execute a scene, as typed operations and as the command line `knorke` that answers in JSON (ADR 0018)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "knorke"
path = "src/main.rs"

[dependencies]
knorke-types = { workspace = true }
knorke-scene = { workspace = true }
knorke-runtime = { workspace = true }
knorke-replay = { workspace = true }
knorke-integration = { workspace = true, default-features = false, features = ["stealth"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
knorke-gpu = { workspace = true, optional = true }
png = { version = "0.17", optional = true }

[features]
# `knorke render`: draws on a Vulkan device (needs the shader pack of `cargo xtask shaders`).
gpu = ["dep:knorke-gpu", "knorke-gpu/sdl", "dep:png", "knorke-integration/stealth-view"]
# `gpu` with SDL3 built from source and linked statically (needs CMake), as in knorke-gpu.
sdl-build-static = ["gpu", "knorke-gpu/sdl-build-static"]

[lints]
workspace = true
