[package]
name = "knorke-integration"
description = "Adapters that join Knorke modules: AI glue (perception feeds memory, flow fields feed goal guesses, navigation costs feed squad rules), the software renderer with its light pass, and (feature `gpu`) the 2D GPU light with its post pass. Domain modules never depend on it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
knorke-types = { workspace = true }
knorke-ai = { workspace = true, optional = true }
knorke-grid = { workspace = true, optional = true }
knorke-navigation = { workspace = true, optional = true }
knorke-observe = { workspace = true, optional = true }
knorke-perception = { workspace = true, optional = true }
knorke-math = { workspace = true, optional = true }
knorke-render = { workspace = true, optional = true }
knorke-lighting = { workspace = true, optional = true }
knorke-exec = { workspace = true, optional = true }
knorke-gpu = { workspace = true, optional = true }
knorke-light2d = { workspace = true, optional = true }
knorke-post = { workspace = true, optional = true }
knorke-replay = { workspace = true, optional = true }
knorke-runtime = { workspace = true, optional = true }
knorke-scene = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[features]
default = ["ai", "pixel"]
ai = ["dep:knorke-ai", "dep:knorke-grid", "dep:knorke-navigation", "dep:knorke-observe", "dep:knorke-perception"]
pixel = ["dep:knorke-math", "dep:knorke-render", "dep:knorke-lighting", "dep:knorke-exec"]
# Profile `stealth`: a yard with guards and an intruder, built from a scene (knorke-scene) and
# run by the runtime (ADR 0018). Not in default: it brings the text formats along.
stealth = ["ai", "dep:knorke-replay", "dep:knorke-runtime", "dep:knorke-scene", "dep:serde", "dep:schemars"]
# GPU 2D light: the pass plan of knorke-light2d and the post pass of knorke-post (not in default).
gpu = ["dep:knorke-gpu", "dep:knorke-math", "dep:knorke-light2d", "dep:knorke-post", "knorke-light2d/gpu", "knorke-post/gpu"]
# `gpu` with SDL3 built from source and linked statically (needs CMake), as in knorke-gpu.
sdl-build-static = ["gpu", "knorke-gpu/sdl-build-static"]

[[example]]
name = "ambush_rules"
required-features = ["ai"]

[[example]]
name = "contagion_scene"
required-features = ["ai"]

[[example]]
name = "goal_guess_scene"
required-features = ["ai"]

[[example]]
name = "mission_guard"
required-features = ["ai"]

[[example]]
name = "perception_scene"
required-features = ["ai"]

[[example]]
name = "squad_walk"
required-features = ["ai"]

[[example]]
name = "stealth_guard"
required-features = ["ai"]

[[example]]
name = "walk_distance_scene"
required-features = ["ai"]

[dev-dependencies]
# GPU scene test (feature `gpu`): golden PNGs and the parity metric of the Chiaro port (P3).
png = "0.17"
# The shared GPU test helpers; only the tests get them (see the feature in knorke-gpu).
knorke-gpu = { workspace = true, features = ["test-support"] }
knorke-contract-tests = { path = "../../tests/contracts" }

[lints]
workspace = true
