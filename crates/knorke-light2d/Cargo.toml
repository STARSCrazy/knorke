[package]
name = "knorke-light2d"
description = "2D lighting of the Knorke Engine, ported from Chiaro: projection, pixel and material codecs, light store and light math (CPU part); GPU stages behind the `gpu` feature (ADR 0014)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# GPU stages on knorke-gpu (SDL3 GPU) and the pass plan (with `Inspect` from knorke-observe, no_std).
gpu = ["dep:knorke-gpu", "knorke-gpu/sdl", "dep:knorke-observe"]
# `gpu` with SDL3 built from source and linked statically (needs CMake), as in knorke-gpu.
sdl-build-static = ["gpu", "knorke-gpu/sdl-build-static"]

[dependencies]
knorke-types = { workspace = true }
knorke-math = { workspace = true }
knorke-gpu = { workspace = true, optional = true }
knorke-observe = { workspace = true, optional = true }

[lints]
workspace = true
