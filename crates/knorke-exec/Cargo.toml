[package]
name = "knorke-exec"
description = "Host-side executors for the knorke_types::Parallel contract: scoped std threads and a rayon work-stealing pool."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["rayon"]
# Work-stealing pool (recommended). Without it only `ScopedThreads` is available.
rayon = ["dep:rayon"]

[dependencies]
knorke-types = { workspace = true }
rayon = { workspace = true, optional = true }

[lints]
workspace = true
