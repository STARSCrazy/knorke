[package]
name = "knorke-host"
description = "Window host of the Knorke Engine on SDL3: window, event loop, clock, GPU device, swapchain and shader pack. The topmost, detachable layer; the game owns the loop (ADR 0022)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Window, events, device and swapchain over SDL3. Links the SDL3 library the host provides,
# as in knorke-gpu. Also switches the picture of the dev-dependency knorke-integration on, for
# the example `stealth_yard`; without `sdl` nothing of the GPU is built.
sdl = ["dep:sdl3-sys", "knorke-gpu/sdl", "knorke-integration/stealth-view"]
# Builds SDL3 from the bundled source and links it statically (needs CMake), as in knorke-gpu.
sdl-build-static = ["sdl", "sdl3-sys/build-from-source-static", "knorke-gpu/sdl-build-static"]
# Audio device over knorke-audio-sdl (ADR 0022 step 7).
audio = ["sdl", "dep:knorke-audio-sdl", "knorke-audio-sdl/sdl"]

[dependencies]
knorke-types = { workspace = true }
knorke-input = { workspace = true }
# Without `sdl` only the shader pack format (`kpak`) is used, which needs no SDL.
knorke-gpu = { workspace = true }
knorke-audio-sdl = { workspace = true, optional = true }
sdl3-sys = { workspace = true, optional = true }

[[example]]
name = "clear"
required-features = ["sdl"]

[[example]]
name = "stealth_yard"
required-features = ["sdl"]

[dev-dependencies]
# The stealth yard in a window (example `stealth_yard`): profile, its picture and the runtime.
# Dev-dependencies only: no library depends on the host (ADR 0022, rule 1).
knorke-integration = { workspace = true, default-features = false, features = ["stealth"] }
knorke-runtime = { workspace = true }
knorke-replay = { workspace = true }
knorke-scene = { workspace = true }
# Positions for the example's sound.
knorke-math = { workspace = true }
# The yard's pictures and sounds as files, by the ids the scene names (ADR 0023).
knorke-assets = { workspace = true }

# Own lint table instead of `workspace = true`: identical, except that `unsafe_code` is
# `deny` so that the FFI boundary to SDL3 can opt in locally (ADR 0005).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

